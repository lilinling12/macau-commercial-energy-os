name: Authority Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  authority:
    name: Validate authority structure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate repository authority
        shell: bash
        run: bash .github/scripts/validate-authority.sh
