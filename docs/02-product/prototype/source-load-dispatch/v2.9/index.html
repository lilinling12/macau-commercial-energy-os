 base.forEach((v,i)=>{s+='<circle class="base-dot" cx="'+x(i)+'" cy="'+y(v)+'" r="4"><title>'+msg("baselineShort")+' '+time(data.baseline[i].start)+': '+fmt(v)+' kW</title></circle>'});
 cand.forEach((v,i)=>{s+='<circle class="cand-dot" cx="'+x(i)+'" cy="'+y(v)+'" r="4.5"><title>'+msg("candidateShort")+' '+time(data.candidate[i].start)+': '+fmt(v)+' kW</title></circle>'});
 cand.forEach((v,i)=>{s+='<text x="'+x(i)+'" y="232" text-anchor="middle">'+time(data.candidate[i].start)+'</text>'});
 s+='<text x="18" y="18">kW</text><text x="720" y="260" text-anchor="end">'+msg("chartEnd")+'</text>';el("chart").innerHTML=s;el("chart").setAttribute("aria-label",msg("chartTitle"));el("chart").setAttribute("aria-describedby","chart-hint")
}
function kind(k){return k==="HVAC"?msg("resourceHvac"):k==="EV"?msg("resourceEv"):msg("resourceWater")}
function renderRows(data){
 el("rows").innerHTML=data.candidate.map((r,i)=>{
  const b=data.baseline[i],loads=(row)=>row.flexible_loads.filter(l=>Number(l.power_kw)>0).map(l=>'<span class="load-name '+(l.kind==="HVAC"?"hvac":l.kind==="EV"?"ev":"water")+'"><i class="marker" aria-hidden="true"></i>'+kind(l.kind)+' '+fmt(l.power_kw,1)+' kW</span>').join(" ")||msg("none");
  const charge=Number(r.ess_charge_kw),dis=Number(r.ess_discharge_kw),ess=charge?msg("charge")+" "+fmt(charge,1):dis?msg("discharge")+" "+fmt(dis,1):msg("idle");
  return '<tr><td class="num">'+time(r.start)+'–'+time(r.end)+'</td><td class="num">'+fmt(b.grid_import_kw)+' / <strong>'+fmt(r.grid_import_kw)+'</strong></td><td class="num">'+fmt(r.pv_generation_kw,1)+' · '+fmt(b.pv_used_kw,1)+' → '+fmt(r.pv_used_kw,1)+'</td><td class="num">'+ess+'</td><td class="num">'+fmt(r.ess_soc_start_kwh,1)+' → '+fmt(r.ess_soc_end_kwh,1)+'</td><td class="load-cell"><div class="load-row"><b>'+msg("baselineShort")+'</b><span>'+loads(b)+'</span></div><div class="load-row"><b>'+msg("candidateShort")+'</b><span>'+loads(r)+'</span></div></td></tr>'
 }).join("")
}
let claimViewMode="actual";
function renderClaims(data){
 if(claimViewMode==="partial-demo"){
  el("claim-demo-banner").hidden=false;el("claim-demo-banner").textContent=msg("claimDemoBanner");
  const rows=[
   ["partialImportLabel","partialImportScope","partialImportReason","partial"],
   ["wholeWindowLabel","wholeWindowScope","wholeWindowReason","withheld"],
   ["savingsLabel","claimWithheld","savingsReason","withheld"],
   ["demandLabel","claimWithheld","demandReason","withheld"]
  ];
  el("claims").innerHTML=rows.map(([label,scope,reason,kind])=>'<li><div><strong>'+msg(label)+'</strong><span class="claim-scope '+kind+'">'+msg(scope)+'</span><small class="claim-reason">'+msg(reason)+'</small></div></li>').join("");
  return
 }
 el("claim-demo-banner").hidden=true;
 const by=new Map();data.claims.forEach(c=>{if(!by.has(c.claim)||(by.get(c.claim).status==="ALLOWED"&&c.status!=="ALLOWED"))by.set(c.claim,c)});
 const order=Object.keys(claimCopy);
 el("claims").innerHTML=order.filter(k=>by.has(k)).map(k=>{const c=by.get(k),pair=claimCopy[k],allow=c.status==="ALLOWED";return '<li><div><strong>'+msg(pair[0])+'</strong><small>'+msg(pair[1])+'</small></div><span class="state '+(allow?"allowed":"held")+'">'+msg(allow?"shownScenario":"notProvided")+'</span></li>'}).join("")
}
function renderResources(data){
 const types=[["HVAC","resourceHvac"],["EV","resourceEv"],["HOT_WATER","resourceWater"]];
 el("resources").innerHTML=types.map(([kindName,label])=>{const task=data.inputs.tasks.find(t=>t.kind===kindName);return '<div class="resource"><div class="resource-head"><strong>'+msg(label)+'</strong><span class="resource-state">'+msg("resourceState")+'</span></div><small>'+msg("loadObjective")+' '+(task?fmt(task.required_energy_kwh,1):"0")+' kWh</small></div>'}).join("")
}
function renderAssumptions(data){
 const inputs=data.inputs;
 const values=[
 msg("assumption1"),
 msg("assumption2")+" PV: "+inputs.pv_generation_kw.map(v=>fmt(v,1)).join(", ")+" kW; fixed load: "+inputs.base_load_kw.map(v=>fmt(v,1)).join(", ")+" kW.",
 msg("assumption3")+" Example MOP/kWh rates: "+inputs.import_rates_mop_per_kwh.join(", ")+".",
 msg("assumption4")+" Task energy: "+inputs.tasks.map(t=>kind(t.kind)+" "+fmt(t.required_energy_kwh,1)+" kWh").join("; ")+".",
 msg("assumption5")+" Initial SOC: "+fmt(inputs.initial_soc_kwh,1)+" kWh; "+fmt(data.search.transitions_examined)+" "+msg("transitionLabel")+".",
 msg("assumption6")
 ];el("assumptions").innerHTML=values.map(x=>"<li>"+x+"</li>").join("")
}
function render(data){
 fixtureData=data;
 const baseKwh=data.baseline.reduce((n,r)=>n+Number(r.grid_import_kw),0),candKwh=data.candidate.reduce((n,r)=>n+Number(r.grid_import_kw),0),basePeak=Math.max(...data.baseline.map(r=>Number(r.grid_import_kw))),candPeak=Math.max(...data.candidate.map(r=>Number(r.grid_import_kw)));
 set("energy-stat",fmt(baseKwh)+" → "+fmt(candKwh)+" kWh");set("peak-stat",fmt(basePeak)+" → "+fmt(candPeak)+" kW");
 renderChart(data);renderRows(data);renderClaims(data);renderResources(data);renderAssumptions(data);el("projection").hidden=false
}
function syncReviewChoice(){document.querySelectorAll("[data-review]").forEach(option=>{const selected=option.value===reviewChoice;option.checked=selected;option.closest(".review-option").classList.toggle("selected",selected)})}
document.querySelectorAll("[data-review]").forEach(option=>option.addEventListener("change",()=>{reviewChoice=option.value;syncReviewChoice();set("review-state",msg("review"+reviewChoice[0].toUpperCase()+reviewChoice.slice(1)+"Msg"))}));
el("locale-select").addEventListener("change",event=>setLanguage(event.target.value));
setLanguage("zh-Hant");
fetch("./dispatch-projection-fixture.json").then(r=>{if(!r.ok)throw new Error("fixture unavailable");return r.json()}).then(render).catch(()=>{set("load-error",msg("error"));el("load-error").style.display="block"});
document.querySelectorAll('input[name="claim-view-mode"]').forEach(input=>input.addEventListener("change",()=>{claimViewMode=input.value;if(fixtureData)renderClaims(fixtureData)}));
</script>
