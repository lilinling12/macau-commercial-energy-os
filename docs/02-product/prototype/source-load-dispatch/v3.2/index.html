let locale="zh-Hant",active=0,reviewChoice=-1;
const root=document.getElementById("panel"),workflow=document.getElementById("workflow"),language=document.getElementById("language");
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderChart(t){
 const base=[8,8,6,4,8,10],cand=[9,9,11,3,5,7],xs=[90,245,400,555,710,865],top=22,bottom=192,scale=14;
 const y=v=>bottom-v*scale;
 const path=a=>a.map((v,i)=>(i?"L":"M")+xs[i]+" "+y(v)).join(" ");
 const points=(a,kind)=>a.map((v,i)=>'<circle class="pt-'+kind+'" cx="'+xs[i]+'" cy="'+y(v)+'" r="5"><title>'+escapeHTML(t.chartTitle)+' '+(i+1)+': '+v+' kW</title></circle>').join("");
 const grid=[0,4,8,12].map(v=>'<g><line class="gridline" x1="56" y1="'+y(v)+'" x2="900" y2="'+y(v)+'"></line><text x="40" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text></g>').join("");
 const ticks=xs.map((x,i)=>'<text x="'+x+'" y="218" text-anchor="middle">'+scenarioRows[i].time[0].slice(0,5)+'</text>').join("");
 return '<svg class="chart" viewBox="0 0 930 235" role="img" aria-labelledby="chartTitle chartDesc"><title id="chartTitle">'+escapeHTML(t.chartTitle)+'</title><desc id="chartDesc">'+escapeHTML(t.chartHint)+'. Baseline 8, 8, 6, 4, 8, 10 kW. Candidate 9, 9, 11, 3, 5, 7 kW.</desc>'+grid+'<path class="base" d="'+path(base)+'"></path><path class="candidate" d="'+path(cand)+'"></path>'+points(base,"base")+points(cand,"candidate")+ticks+'</svg>';

 }else if(active===2){
  out+='<div class="metric-band">'+d.metrics.map(m=>'<div class="metric"><label>'+escapeHTML(m[0])+'</label><strong>'+escapeHTML(m[1])+'</strong><small>'+escapeHTML(m[2])+'</small></div>').join("")+'</div>';

 }else if(active===3){

 }

function render(){

 const d=t.stages[active];root.setAttribute("aria-labelledby","stageTitle");root.innerHTML='<div class="panel-head"><div><h2 id="stageTitle">'+escapeHTML(d.title)+'</h2><p>'+escapeHTML(d.desc)+'</p></div><span class="count">'+String(active+1).padStart(2,"0")+' / 06</span></div><div class="body">'+stageContent(t)+'</div>';
 document.getElementById("previous").textContent=active===0?t.first:t.prev;document.getElementById("previous").disabled=active===0;document.getElementById("next").textContent=active===5?t.first:t.next;document.getElementById("next").setAttribute("aria-label",active===5?t.first:t.next);
 workflow.querySelectorAll("[data-step]").forEach(b=>b.addEventListener("click",()=>{active=Number(b.dataset.step);render();workflow.querySelector('[data-step="'+active+'"]').focus({preventScroll:true})}));
 root.querySelectorAll("[data-review]").forEach(b=>b.addEventListener("click",()=>{reviewChoice=Number(b.dataset.review);render();document.getElementById("reviewState").focus()}));
 document.getElementById("previous").onclick=()=>{active=Math.max(0,active-1);render();workflow.querySelector('[data-step="'+active+'"]').focus({preventScroll:true})};document.getElementById("next").onclick=()=>{active=active===5?0:active+1;render();workflow.querySelector('[data-step="'+active+'"]').focus({preventScroll:true})};

workflow.addEventListener("keydown",e=>{if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;const dir=e.key==="ArrowRight"?1:-1;active=Math.max(0,Math.min(5,active+dir));render();workflow.querySelector('[data-step="'+active+'"]').focus()});
