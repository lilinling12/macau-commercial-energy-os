}
language.addEventListener("change",()=>{locale=language.value;render()});
workflow.addEventListener("keydown",e=>{if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;const dir=e.key==="ArrowRight"?1:-1;active=Math.max(0,Math.min(5,active+dir));render();workflow.querySelector('[data-step="'+active+'"]').focus()});
document.addEventListener("keydown",e=>{if(e.target.closest("button,select"))return;if(e.key==="ArrowRight"||e.key==="ArrowLeft"){active=Math.max(0,Math.min(5,active+(e.key==="ArrowRight"?1:-1)));render();workflow.querySelector('[data-step="'+active+'"]').focus()}});
render();
fetch("./app11-ui-projection.json").then(r=>{if(!r.ok)throw new Error("projection unavailable");return r.json()}).then(data=>{projectionData=data;fixtureData=data.source_result;render()}).catch(()=>{projectionData=null;fixtureData=null;render()});
</script>
</body>
</html>
