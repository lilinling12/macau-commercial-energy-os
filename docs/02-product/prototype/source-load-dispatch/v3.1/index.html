let locale="zh-Hant-MO",active=0,review=-1;const steps=document.getElementById('steps'),panel=document.getElementById('panel'),lang=document.getElementById('language');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stageHtml(d){
  let out="";
  if(d.cards){
    out += '<div class="grid">' + d.cards.map((c,i) => '<article class="card '+(i===0?'tint':'')+'"><h3>'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p><span class="status">'+esc(c[2])+'</span></article>').join('') + '</div>';
  }
  if(d.flow){
    const heading = locale==="en" ? "Physical energy path" : locale==="pt-MO" ? "Percurso físico da energia" : "物理能源路徑";
    out += '<h3 class="section-title">'+esc(heading)+'</h3><div class="flow">'+d.flow.map((x,i)=>(i?'<b aria-hidden="true">→</b>':'')+'<span>'+esc(x)+'</span>').join('')+'</div>';
  }
  if(d.chart){
    const max=44;
    const indicators = locale==="en" ? "Six-hour indicators" : locale==="pt-MO" ? "Indicadores de seis horas" : "六小時指標";
    const details = locale==="en" ? "Interval detail" : locale==="pt-MO" ? "Detalhe por intervalo" : "時段明細";
    out += '<h3 class="section-title">'+esc(indicators)+'</h3><div class="grid">'+d.chart.map(x=>'<article class="card"><span class="barlabel">'+esc(x.name)+'</span><span class="big mono">'+x.value+'<span class="unit"> '+esc(x.unit)+'</span></span><div class="track" aria-hidden="true"><div class="fill '+x.kind+'" style="width:'+Math.max(8,Math.round(x.value/max*100))+'%"></div></div></article>').join('')+'</div>';
    out += '<h3 class="section-title">'+esc(details)+'</h3><div class="table-wrap"><table><thead><tr>'+d.table[0].map(x=>'<th scope="col">'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+d.table.slice(1).map(row=>'<tr>'+row.map(x=>'<td class="mono">'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  }
  if(d.options){
    const response = locale==="en" ? "Research-only response" : locale==="pt-MO" ? "Resposta apenas para investigação" : "僅供研究的回應";
    const neutral = locale==="en" ? "No review choice has been recorded." : locale==="pt-MO" ? "Nenhuma decisão de revisão foi registada." : "尚未選擇審閱意見。";
    out += '<h3 class="section-title">'+esc(response)+'</h3><div class="review-options" role="group">'+d.options.map((x,i)=>'<button class="review-option" type="button" aria-pressed="'+(review===i)+'" data-review="'+i+'"><strong>'+esc(x[0])+'</strong><small>'+esc(x[1])+'</small></button>').join('')+'</div><div id="reviewState" class="review-state" role="status" aria-live="polite">'+esc(review<0?neutral:d.options[review][1])+'</div>';
  }
  out += '<div class="callout '+(active===2||active===3?'warn':'')+'">'+esc(d.callout)+'</div>';
  return out;
}function render(){const t=languages[locale];document.documentElement.lang=locale;document.title=t.pageTitle;document.querySelector('meta[name=description]').content=t.metaDescription;lang.value=locale;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t[el.dataset.i]);steps.setAttribute("aria-label",t.workflow);document.querySelector(".rail").setAttribute("aria-label",t.workflow);lang.setAttribute("aria-label",t.languageLabel);steps.innerHTML=t.stageNames.map((name,i)=>`<button class="step" id="step-${i}" type="button" role="tab" aria-selected="${active===i}" aria-current="${active===i?'step':'false'}" aria-controls="panel" tabindex="${active===i?'0':'-1'}" data-step="${i}"><span class="step-no">${String(i+1).padStart(2,'0')}</span><span class="step-copy">${esc(name)}</span></button>`).join('');const d=t.stages[active];panel.innerHTML=`<div class="panel-head"><div><h2>${esc(d.title)}</h2><p>${esc(d.desc)}</p></div><span class="stage-index">${String(active+1).padStart(2,'0')} / 06</span></div><div class="stage-body">${stageHtml(d)}</div>`;document.getElementById('previous').textContent=active===0?t.last:t.previous;document.getElementById('previous').disabled=active===0;document.getElementById('next').textContent=active===5?t.last:t.next;document.getElementById('next').dataset.last=active===5?'true':'false';document.getElementById('previous').dataset.last=active===0?'true':'false';document.getElementById('previous').setAttribute('aria-label',active===0?t.last:t.previous);document.getElementById('next').setAttribute('aria-label',active===5?t.last:t.next);document.getElementById('panel').setAttribute('aria-labelledby',`step-${active}`);document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{active=Number(b.dataset.step);render();document.getElementById('panel').focus()}));document.querySelectorAll('[data-review]').forEach(b=>b.addEventListener('click',()=>{review=Number(b.dataset.review);renderReview()}));}
function renderReview(){const t=languages[locale],d=t.stages[4],state=document.getElementById('reviewState');if(!state)return;state.textContent=review<0?(locale==='en'?'No review choice has been recorded.':locale==='pt-MO'?'Nenhuma decisão de revisão foi registada.':'尚未選擇審閱意見。'):d.options[review][1];document.querySelectorAll('[data-review]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.review)===review?'true':'false'))}
steps.addEventListener("keydown",e=>{if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;e.preventDefault();active=e.key==="ArrowRight"?Math.min(5,active+1):Math.max(0,active-1);render();document.getElementById("step-"+active).focus()});lang.addEventListener('change',()=>{locale=lang.value;render()});document.getElementById('previous').addEventListener('click',()=>{active=active===0?0:active-1;render();panel.focus()});document.getElementById('next').addEventListener('click',()=>{active=active===5?0:active+1;render();panel.focus()});document.addEventListener('keydown',e=>{if(e.target.closest('select,button'))return;if(e.key==='ArrowRight'){active=Math.min(5,active+1);render();document.getElementById(`step-${active}`).focus()}if(e.key==='ArrowLeft'){active=Math.max(0,active-1);render();document.getElementById(`step-${active}`).focus()}});render();
</script>
